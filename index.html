<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jul Balloons</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f7f7f7;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:#8f4bd8;
    margin-bottom:10px;
}

.escenario{
    position:relative;
    max-width:900px;
    margin:20px auto;
}

.decoracion{
    width:100%;
    display:block;
}

.marca{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    font-weight:bold;
    color:#000;
    opacity:0.05;
    pointer-events:none;
}

.happy{
    position:absolute;
    top:34%;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:3px;
    font-weight:bold;
    color:#000;
    text-align:center;
}

</style>
</head>

<body>

<h1>🎈 JUL BALLOONS 🎈</h1>

<div class="escenario">

    <div class="marca">
        JUL BALLOONS
    </div>

    <img src="base.png" class="decoracion">

    <div class="happy">
        HAPPY BIRTHDAY
    </div>

</div>

</body>
</html>
