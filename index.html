<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jul Balloons</title>

<style>

body{
font-family:Arial,sans-serif;
background:#fafafa;
padding:20px;
max-width:900px;
margin:auto;
}

h1{
text-align:center;
color:#ff4fa3;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
}

.preview{
position:relative;
}

.preview img{
width:100%;
border-radius:15px;
}

.overlay{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
opacity:.35;
mix-blend-mode:multiply;
border-radius:15px;
}

.info{
position:absolute;
bottom:15px;
left:15px;
background:white;
padding:10px;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:#25D366;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>🎈 Jul Balloons</h1>

<input type="file" id="foto">

<input type="text" id="nombre" placeholder="Nombre">

<input type="number" id="edad" placeholder="Edad">

<select id="color">
<option value="#ff69b4">Rosa</option>
<option value="#3f51b5">Azul</option>
<option value="#ffd700">Dorado</option>
<option value="#9c27b0">Lila</option>
<option value="#4caf50">Verde</option>
</select>

<div class="preview">

<img id="imagen"
src="https://picsum.photos/800/500">

<div class="overlay" id="overlay"></div>

<div class="info">
<div id="nombreVista">Nombre</div>
<div id="edadVista">Edad</div>
</div>

</div>

<br>

<button onclick="enviarWhatsapp()">
Solicitar Cotización
</button>

<script>

const foto=document.getElementById('foto');
const imagen=document.getElementById('imagen');

foto.addEventListener('change',function(){

const archivo=this.files[0];

if(archivo){

const lector=new FileReader();

lector.onload=function(e){

imagen.src=e.target.result;

}

lector.readAsDataURL(archivo);

}

});

document.getElementById('nombre')
.addEventListener('input',function(){

document.getElementById('nombreVista')
.innerText=this.value;

});

document.getElementById('edad')
.addEventListener('input',function(){

document.getElementById('edadVista')
.innerText='Edad: '+this.value;

});

document.getElementById('color')
.addEventListener('change',function(){

document.getElementById('overlay')
.style.background=this.value;

});

function enviarWhatsapp(){

const nombre=
document.getElementById('nombre').value;

const edad=
document.getElementById('edad').value;

const mensaje=
`Hola, deseo cotización.\nNombre: ${nombre}\nEdad: ${edad}`;

window.open(
'https://wa.me/17875551234?text='+
encodeURIComponent(mensaje)
);

}

</script>

</body>
</html>
