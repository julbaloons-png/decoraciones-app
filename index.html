<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jul Balloons</title>

<style>

body{
    background:#f7f7f7;
    font-family:Arial,sans-serif;
    padding:20px;
}

h1{
    text-align:center;
    color:#8f4bd8;
}

.controles{
    max-width:400px;
    margin:auto;
    margin-bottom:20px;
}

select{
    width:100%;
    padding:12px;
    font-size:16px;
}

.escenario{
    position:relative;
    max-width:900px;
    margin:auto;
}

.capa{
    position:absolute;
    width:100%;
    left:0;
}

#panel{
    z-index:1;
}

#arco{
    z-index:2;
}

#derecha{
    z-index:3;
}

.happy{
    position:absolute;
    top:43%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    font-size:14px;
    font-weight:bold;
    letter-spacing:4px;
}

</style>
</head>

<body>

<h1>🎈 JUL BALLOONS 🎈</h1>

<div class="controles">

<select id="colorPanel">
<option value="white">Blanco</option>
<option value="pink">Rosa</option>
<option value="lightblue">Azul</option>
<option value="lavender">Lila</option>
<option value="gold">Dorado</option>
<option value="black">Negro</option>
</select>

</div>

<div class="escenario">

<img
src="panel.png"
id="panel"
class="capa">

<img
src="arco.png"
id="arco"
class="capa">

<img
src="derecha.png"
id="derecha"
class="capa">

<div class="happy">
HAPPY BIRTHDAY
</div>

</div>

<script>

document.getElementById("colorPanel")
.addEventListener("change", function(){

const color=this.value;

document.getElementById("panel")
.style.filter=
`drop-shadow(0 0 0 ${color}) saturate(300%)`;

});

</script>

</body>
</html>
